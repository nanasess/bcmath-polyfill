name: CI
on: [push, pull_request]

permissions:
    contents: read #  to fetch code (actions/checkout)

jobs:
    php-cs-fixer:
        name: PHP-CS-Fixer
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            -   name: Install dependencies
                uses: php-actions/composer@8a65f0d3c6a1d17ca4800491a40b5756a4c164f3 # v6
                with:
                    php_version: '8.1'
            -   name: Run PHP-CS-Fixer
                run: vendor/bin/php-cs-fixer fix --dry-run --diff --allow-risky=yes

    phpstan:
        name: PHPStan
        needs: php-cs-fixer
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            -   name: Pin phpseclib ${{ matrix.phpseclib }}
                run: composer require --no-update --no-interaction 'phpseclib/phpseclib:${{ matrix.phpseclib }}'
            -   name: Install dependencies
                uses: php-actions/composer@8a65f0d3c6a1d17ca4800491a40b5756a4c164f3 # v6
                with:
                    php_version: '8.1'
            -   name: Run PHPStan
                uses: php-actions/phpstan@d8f8887acaac249b05ac11909c4cdbb018f52211 # v3
                with:
                    php_version: '8.1'
        strategy:
            fail-fast: false
            matrix:
                # bcmath_compat\Math\BigInteger is aliased to phpseclib3 or phpseclib4
                # at runtime, so static analysis must pass against both.
                phpseclib: ['^3.0', '^4.0']

    tests:
        name: Tests
        needs: phpstan
        timeout-minutes: 10
        runs-on: ${{ matrix.os }}
        steps:
            -   name: Checkout
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            -   name: Setup PHP
                uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
                with:
                    php-version: ${{ matrix.php-version }}
            -   name: Show whether GMP is loaded
                # The polyfill calls GMP directly when it is loaded, and phpseclib's pure-PHP engine otherwise
                shell: bash
                run: php -r 'echo "gmp: ", extension_loaded("gmp") ? "loaded" : "not loaded", PHP_EOL;'
            -   name: Pin phpseclib ${{ matrix.phpseclib }}
                # On Windows the default shell runs composer through cmd, which drops the "^" of the constraint
                shell: bash
                run: composer require --no-update --no-interaction 'phpseclib/phpseclib:${{ matrix.phpseclib }}'
            -   name: Composer Install
                run: composer install --no-interaction --no-cache
            -   name: PHPUnit
                run: vendor/bin/phpunit
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest, macos-latest]
                php-version: ['8.1', '8.2', '8.3', '8.4', '8.5', '8.6']
                phpseclib: ['^4.0']
                include:
                    # phpseclib 3 is still supported; cover both ends of the PHP range on Linux
                    -   os: ubuntu-latest
                        php-version: '8.1'
                        phpseclib: '^3.0'
                    -   os: ubuntu-latest
                        php-version: '8.6'
                        phpseclib: '^3.0'

    tests-without-bcmath:
        name: Tests (without BCMath extension)
        needs: phpstan
        timeout-minutes: 10
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            -   name: Setup PHP
                uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
                with:
                    php-version: ${{ matrix.php-version }}
                    extensions: :bcmath # ubuntu only
            -   name: Show whether GMP is loaded
                # The polyfill calls GMP directly when it is loaded, and phpseclib's pure-PHP engine otherwise
                run: php -r 'echo "gmp: ", extension_loaded("gmp") ? "loaded" : "not loaded", PHP_EOL;'
            -   name: Pin phpseclib ${{ matrix.phpseclib }}
                run: composer require --no-update --no-interaction 'phpseclib/phpseclib:${{ matrix.phpseclib }}'
            -   name: Composer Install
                run: composer install --no-interaction --no-cache
            -   name: PHPUnit (without BCMath extension)
                run: vendor/bin/phpunit --group without-bcmath
        strategy:
            fail-fast: false
            matrix:
                php-version: ['8.1', '8.2', '8.3', '8.4', '8.5', '8.6']
                phpseclib: ['^3.0', '^4.0']

    docker-phpt-tests:
        name: Docker PHPT Tests
        needs: phpstan
        timeout-minutes: 15
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            -   name: Checkout php-src repository
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                with:
                    repository: php/php-src
                    # Use the tests of the same PHP version; master tracks the next development version
                    ref: PHP-${{ matrix.php-version }}
                    path: php-src
            -   name: Checkout php-src tests that expect the PHP 8.4+ behavior
                if: matrix.phpt-override-files
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                with:
                    repository: php/php-src
                    ref: PHP-8.4
                    path: php-src-8.4
                    sparse-checkout: ext/bcmath/tests
            -   name: Replace php-src tests with the PHP 8.4 ones
                if: matrix.phpt-override-files
                run: |
                  for file in ${{ matrix.phpt-override-files }}; do
                    cp "php-src-8.4/ext/bcmath/tests/$file" "php-src/ext/bcmath/tests/$file"
                  done
            -   name: Build Docker test image
                run: docker build -f Dockerfile.test-without-bcmath --build-arg PHP_VERSION=${{ matrix.php-version }} -t bcmath-phpt-test:${{ matrix.php-version }} .
            -   name: Run Docker-based PHPT tests
                run: |
                  # gh15968, gh16262, gh20006, bcround_precision_bounds, bc_is_zero_for_scale_clamp: require the BcMath\Number class (not supported by polyfill)
                  # bcscale_variation003: expects bcscale() to update ini_get('bcmath.scale'), which cannot be done without the native extension
                  # bcmul_check_overflow: multiplies numbers of up to 131072 digits and times out, since the Docker image has no GMP and phpseclib falls back to a slow engine
                  # gh17398: php-src expects a "Hard memory limit" fatal error, which differs from the polyfill's "Allowed memory size" error
                  docker run --rm -v $PWD:/app bcmath-phpt-test:${{ matrix.php-version }} --skip gh15968,gh16262,gh20006,bcround_precision_bounds,bc_is_zero_for_scale_clamp,bcscale_variation003,bcmul_check_overflow,gh17398
        strategy:
            fail-fast: false
            matrix:
                php-version: ['8.1', '8.2', '8.3', '8.4', '8.5', '8.6']
                include:
                    # The polyfill follows PHP 8.4+ (see "Behavior Follows PHP 8.4+" in README.md), so bcpow of
                    # PHP-8.3 expects a different result for 0 ** -15 (0 instead of "Negative power of zero").
                    # Run it with the PHP 8.4 test instead. Its run_bcmath_tests_function.inc is replaced too,
                    # since the PHP-8.3 one does not catch the exception and the test would stop at that case.
                    -   php-version: '8.3'
                        phpt-override-files: 'bcpow.phpt run_bcmath_tests_function.inc'
